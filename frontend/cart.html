<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="description" content="سلة مشترياتك من مركز أبو ربيع للمعدات">
    <title>سلة المشتريات | مركز أبو ربيع</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo"><img src="assets/logo.jpg" alt="شعار مركز أبو ربيع للمعدات"></a>
            <ul class="nav-links" id="site-navigation">
                <li><a href="/">الرئيسية</a></li>
                <li><a href="products.html">المنتجات</a></li>
                <li><a href="cart.html" class="active nav-cart-link"><i class="fa-solid fa-cart-shopping"></i> السلة <span class="nav-cart-count" aria-live="polite">0</span></a></li>
                <li><a href="account.html">حسابي</a></li>
            </ul>
            <button type="button" class="menu-toggle" aria-label="فتح القائمة" aria-expanded="false" aria-controls="site-navigation"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        </div>
    </nav>

    <main class="cart-page container">
        <header class="cart-page-heading">
            <p class="cart-eyebrow">مركز أبو ربيع للمعدات</p>
            <h1>سلة المشتريات</h1>
            <p>راجع المنتجات والكميات قبل تأكيد طلبك.</p>
        </header>

        <div class="cart-layout">
            <section class="cart-panel" aria-labelledby="cart-items-heading">
                <div class="cart-panel-heading">
                    <h2 id="cart-items-heading">منتجاتك</h2>
                    <a href="products.html">متابعة التسوق <i class="fa-solid fa-arrow-left"></i></a>
                </div>
                <div id="cart-page-items" class="cart-page-items" aria-live="polite"></div>
            </section>

            <aside class="cart-panel checkout-panel">
                <h2>إتمام الطلب</h2>
                <div class="cart-total-row"><span>الإجمالي التقديري</span><strong id="cart-page-total">0 ج.م</strong></div>
                <p class="cart-price-note">يؤكد الخادم الأسعار النهائية عند إرسال الطلب.</p>
                <form id="cart-checkout-form">
                    <label for="checkout-name">الاسم بالكامل</label>
                    <input id="checkout-name" name="customerName" autocomplete="name" required maxlength="120">
                    <label for="checkout-phone">رقم الهاتف</label>
                    <input id="checkout-phone" name="customerPhone" type="tel" autocomplete="tel" required>
                    <label for="checkout-address">عنوان التوصيل</label>
                    <textarea id="checkout-address" name="customerAddress" autocomplete="street-address" required rows="3"></textarea>
                    <label for="checkout-notes">ملاحظات (اختياري)</label>
                    <textarea id="checkout-notes" name="notes" rows="2"></textarea>
                    <button id="cart-submit" type="submit" class="cart-submit"><i class="fa-solid fa-check"></i> تأكيد الطلب</button>
                </form>
                <div id="cart-checkout-status" class="cart-checkout-status" role="status" aria-live="polite"></div>
            </aside>
        </div>
    </main>

    <footer class="cart-page-footer"><a href="/">العودة إلى المتجر</a></footer>
    <script src="store-settings.js"></script>
    <script src="script.js"></script>
    <script src="cart.js"></script>
</body>
</html>
